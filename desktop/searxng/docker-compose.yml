# SearXNG for Fixer's web search. Deployed to /volume2/docker/searxng on the NAS (LAN only, port 8888).
# Pinned tag + Watchtower off (the owner's rule: Watchtower broke romm on an unpinned upgrade).
services:
  searxng:
    image: searxng/searxng:2026.11.14-a7128d5d1
    container_name: searxng
    restart: unless-stopped
    network_mode: bridge    # the NAS's Docker has no free address pools for a new network
    ports:
      - "8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8888/}   # real address in .env beside this file
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "none"        # 11-17 audit: failed-engine warnings carried the query text into the log

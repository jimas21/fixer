# SearXNG settings for Fixer. __SECRET__ is replaced with a random key on the NAS at deploy time.
use_default_settings: true
general:
  instance_name: "searxng"
  debug: false
server:
  secret_key: "__SECRET__"
  limiter: false          # LAN only, single user
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats:
    - html
    - json                # Fixer reads results as JSON
ui:
  query_in_title: false
